[package]
name = "euclid_fast"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "euclid_fast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
rayon = "1"
memmap2 = "0.9"
num_cpus = "1"
parquet = { version = "60", features = ["arrow"] }
arrow-array = "60"
flate2 = "1"

# Max performance: full LTO and a single codegen unit (better cross-function
# optimisation; slower to compile, faster binary). `panic = "abort"` is not
# used here because PyO3 needs to be able to surface Python exceptions.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
